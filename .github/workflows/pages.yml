name: Pages
# On every push to dev (and once a day): build, check, version, deploy, tag. The seed pipeline from
# SovereignWebsite__Factory (f759821, seed/site-template), adopted for design.agents.sovereignweb.site:
#  - the site is built from docs/ by tools/build.py (its output under site/ is also committed);
#  - the agent's public key is copied from the Factory's team/keys.json into site/key.json, never typed by hand;
#  - SWS_OWN_SITE=1: one of the organisation's own sites, so it keeps the family bar (quality.mjs check 4);
#  - the version chip is placed inside the footer (.github/ci/build.mjs), so it sits in a landmark.
# Any failed check stops the run before anything is deployed or tagged. The version is made from the git tags
# (major and minor below, set by a person; the patch is the last tag's plus one); a commit that already has a
# tag (the daily run) keeps it. It is shown on every page from version.json, never typed by hand.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  VERSION_BASE: '0.1'
  SWS_OWN_SITE: '1'
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        name: Work out the next version from the tags
        run: |
          here=$(git tag --points-at HEAD --list "v${VERSION_BASE}.*" | head -1)
          if [ -n "$here" ]; then echo "version=$here" >> "$GITHUB_OUTPUT"; echo "tagged=yes" >> "$GITHUB_OUTPUT"; echo "Version: $here (already tagged)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "tagged=no" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the pages from docs/ (tools/build.py)
        run: |
          pip install --quiet markdown==3.7
          python3 tools/build.py
      - name: The agent's key, from the Factory's team/keys.json
        env:
          AGENT: 'design.b@SovereignWebsite.dinis'
        run: |
          curl -fsS https://raw.githubusercontent.com/SovereignWebsite/SovereignWebsite__Factory/dev/team/keys.json -o keys.json
          node -e '
            const ks = require("./keys.json").keys.filter((k) => k.agent === process.env.AGENT && k.status === "active");
            const out = { agent: process.env.AGENT, source: "https://github.com/SovereignWebsite/SovereignWebsite__Factory/blob/dev/team/keys.json", copied: new Date().toISOString(),
              keys: ks.map((k) => ({ fingerprint: k.fingerprint, signing_fingerprint: k.signing_fingerprint, session: k.session, sign: k.bundle.sign, encrypt: k.bundle.encrypt })) };
            require("fs").writeFileSync("site/key.json", JSON.stringify(out, null, 2) + "\n");
            console.log(ks.length ? `published ${ks.length} key(s) for ${process.env.AGENT}` : `no active key in team/keys.json for ${process.env.AGENT}`);'
          rm keys.json
      - name: Build (version.json and the version chip)
        run: node .github/ci/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - name: Link previews (Open Graph tags and the share card)
        run: node .github/ci/share-check.mjs _site
      - name: Links, em dashes, family strip and leak scan
        run: node .github/ci/quality.mjs _site
      - name: HTML validity
        run: npx --yes html-validate@8.24.0 --config .github/ci/htmlvalidate.json "_site/**/*.html"
      - name: Accessibility (axe-core)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 @axe-core/playwright@4.10.1
          npx playwright install --with-deps chromium
          node .github/ci/axe.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: needs.build.outputs.tagged != 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          echo "Released and tagged $VERSION" >> "$GITHUB_STEP_SUMMARY"
